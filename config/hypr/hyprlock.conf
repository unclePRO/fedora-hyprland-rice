# ==========================================================
# HYPRLOCK CONFIGURATION
# Aesthetic: Minimal macOS / Apple Glass
# Features: Instant Clock, Nerd Font Icons, Dynamic Input
# ==========================================================

general {
    hide_cursor = true
}

# --- ANIMATIONS ---
animations {
    enabled = true
    bezier = easeOutCubic, 0.215, 0.61, 0.355, 1
    
    animation = fadeIn, 1, 15, easeOutCubic
    animation = fadeOut, 1, 5, easeOutCubic 
    animation = inputFieldDots, 1, 5, easeOutCubic
}

# --- APPLE GLASS BACKGROUND ---
background {
    monitor =
    path = ~/.config/wallpapers/wpmountainteal.jpg
    
    blur_passes = 4
    blur_size = 12
    contrast = 0.9000
    brightness = 0.8172
    vibrancy = 0.2500
    vibrancy_darkness = 0.0
}

# --- TOP RIGHT: BATTERY (NERD FONT ICON) ---
label {
    monitor =
    text = cmd[update:30000] echo "󰁹 $(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1)%"
    color = rgba(216, 222, 233, 0.8)
    font_size = 14
    font_family = JetBrainsMono Nerd Font Mono
    position = -20, -20
    halign = right
    valign = top
    shadow_passes = 1
}

# --- CENTER: MAC OS BOLD CLOCK (INSTANT) ---
label {
    monitor =
    text = <b><big> $TIME </big></b>
    color = rgb(216, 222, 233) 
    font_size = 75
    font_family = JetBrainsMono Nerd Font Mono ExtraBold
    position = 0, 240 
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 5
}

# --- CENTER: DATE ---
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgb(136, 192, 208) 
    font_size = 18
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 160 
    halign = center
    valign = center
    shadow_passes = 1
}

# --- AVATAR / PROFILE PICTURE ---
image {
    monitor =
    path = ~/.config/hypr/avatar.png
    size = 90 
    rounding = -1 
    border_size = 2
    border_color = rgba(255, 255, 255, 0.15) 
    position = 0, 30 
    halign = center
    valign = center
    shadow_passes = 1
}

# --- CHILL GREETING ---
label {
    monitor =
    text = Hello, unclepro!
    color = rgba(216, 222, 233, 0.6) 
    font_size = 14
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, -40 
    halign = center
    valign = center
}

# --- DYNAMIC PASSWORD FIELD ---
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    
    outer_color = rgba(255, 255, 255, 0.15) 
    inner_color = rgba(10, 25, 35, 0.4)    
    font_color = rgb(216, 222, 233)        
    
    # Box only appears when typing
    fade_on_empty = true
    
    font_family = JetBrainsMono Nerd Font Mono
    placeholder_text = <i><span foreground="##88c0d0">Enter Password</span></i>
    
    check_color = rgba(136, 192, 208, 0.8) 
    fail_color = rgba(191, 97, 106, 0.8) 
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i> 
    fail_transition = 300 
    capslock_color = rgba(235, 203, 139, 0.8) 
    
    hide_input = false
    position = 0, -120 
    halign = center
    valign = center
    shadow_passes = 1
}
